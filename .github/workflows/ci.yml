name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: knowflow
          POSTGRES_PASSWORD: knowflow
          POSTGRES_DB: knowflow_ventas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knowflow" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://knowflow:knowflow@localhost:5432/knowflow_ventas
      NEXTAUTH_SECRET: ci-only-secret
      APP_MODE: investor_demo
      EMBEDDINGS_PROVIDER: fake
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run seed:catalogo
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
